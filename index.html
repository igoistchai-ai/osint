<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NZX OSINT TOOL</title>
<style>
:root{
  --bg:#06070a;
  --panel:rgba(12,14,19,.78);
  --panel2:#10131a;
  --card:#12161e;
  --card2:#171c25;
  --text:#f4f6fa;
  --muted:#858c99;
  --dim:#555d69;
  --border:rgba(255,255,255,.10);
  --border-hi:rgba(255,255,255,.25);
  --accent:#dfe7ff;
  --glow:rgba(150,180,255,.16);
  --radius:18px;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  color:var(--text);
  background:
    radial-gradient(900px 600px at 50% -20%,rgba(83,110,180,.13),transparent 65%),
    radial-gradient(700px 500px at 100% 100%,rgba(120,80,190,.07),transparent 65%),
    var(--bg);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}
button,input,textarea{font:inherit}
button{color:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.topbar{
  height:70px;flex:none;display:flex;align-items:center;gap:12px;
  padding:10px 14px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,rgba(10,12,16,.92),rgba(8,9,12,.70));
  backdrop-filter:blur(26px);z-index:50;
}
.brand{display:flex;align-items:center;gap:11px;min-width:max-content}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(145deg,#fff,#aeb9d2);
  color:#080a0e;font-size:16px;font-weight:900;
  box-shadow:0 0 28px rgba(190,210,255,.14);
}
.brand-name{font-size:15px;font-weight:850;letter-spacing:.5px}
.brand-sub{font-size:10px;color:#6f7785;margin-top:2px;letter-spacing:1.4px}
.actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.search{
  width:min(300px,30vw);height:40px;border:1px solid var(--border);
  background:rgba(255,255,255,.035);border-radius:12px;
  display:flex;align-items:center;gap:8px;padding:0 12px;
  transition:.2s;
}
.search:focus-within{border-color:var(--border-hi);box-shadow:0 0 0 4px rgba(255,255,255,.025)}
.search svg{opacity:.48;flex:none}
.search input{width:100%;background:transparent;border:0;outline:0;color:#fff}
.search input::placeholder{color:#616977}
.btn{
  height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--border);
  background:rgba(255,255,255,.035);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .18s,background .18s,border-color .18s,box-shadow .18s;
}
.btn:hover{background:rgba(255,255,255,.08);border-color:var(--border-hi)}
.btn:active{transform:scale(.96)}
.btn.primary{
  color:#090b0f;background:linear-gradient(135deg,#fff,#cdd6e8);
  border-color:#fff;font-weight:800;box-shadow:0 6px 28px rgba(190,210,255,.10)
}
.btn.primary:hover{box-shadow:0 9px 34px rgba(190,210,255,.18);transform:translateY(-1px)}
.icon{width:40px;padding:0}
.workspace{position:relative;flex:1;min-height:0;overflow:hidden}
.canvas{
  position:absolute;inset:0;overflow:hidden;cursor:grab;
  background-image:
    linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
    radial-gradient(circle,rgba(255,255,255,.11) 1px,transparent 1px);
  background-size:80px 80px,80px 80px,28px 28px;
  background-position:center center;
}
.canvas:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at center,transparent 25%,rgba(0,0,0,.25) 100%);
}
.canvas.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
.edges{
  position:absolute;left:-5000px;top:-5000px;width:10000px;height:10000px;
  overflow:visible;pointer-events:none;
}
.edge{
  fill:none;stroke:rgba(190,205,235,.30);stroke-width:2.2;
  stroke-linecap:round;vector-effect:non-scaling-stroke;
  filter:drop-shadow(0 0 5px rgba(160,190,255,.12));
  transition:stroke .2s,stroke-width .2s,opacity .2s;
}
.edge-bg{
  fill:none;stroke:rgba(150,180,255,.07);stroke-width:9;
  stroke-linecap:round;vector-effect:non-scaling-stroke;
}
.edge.new{animation:lineIn .55s cubic-bezier(.2,.8,.2,1) both}
.edge.active{stroke:#fff;stroke-width:3;filter:drop-shadow(0 0 8px rgba(255,255,255,.4))}
@keyframes lineIn{
  from{stroke-dasharray:0 1000;opacity:0}
  to{stroke-dasharray:1000 0;opacity:1}
}
.node{
  position:absolute;width:230px;min-height:112px;
  transform:translate(-50%,-50%);
  user-select:none;touch-action:none;
  animation:nodeIn .45s cubic-bezier(.16,1,.3,1) both;
}
@keyframes nodeIn{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.72);filter:blur(5px)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1.035);filter:blur(0)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
}
.node.removing{animation:nodeOut .22s ease forwards}
@keyframes nodeOut{
  to{opacity:0;transform:translate(-50%,-50%) scale(.7);filter:blur(4px)}
}
.card{
  min-height:112px;width:100%;padding:17px 18px;
  border:1px solid rgba(255,255,255,.13);border-radius:20px;
  background:
    linear-gradient(145deg,rgba(28,33,43,.97),rgba(12,15,20,.98));
  box-shadow:
    0 20px 60px rgba(0,0,0,.46),
    inset 0 1px 0 rgba(255,255,255,.055);
  cursor:grab;position:relative;overflow:hidden;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),border-color .2s,box-shadow .2s;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,rgba(255,255,255,.06),transparent 35%);
  opacity:.7;
}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,.28);
  box-shadow:0 27px 70px rgba(0,0,0,.55),0 0 30px rgba(120,150,220,.07);
}
.node.moving .card{
  cursor:grabbing;transform:scale(1.045) rotate(.35deg);
  border-color:rgba(255,255,255,.52);
  box-shadow:0 32px 90px rgba(0,0,0,.65),0 0 38px rgba(150,180,255,.13);
}
.node.near .card{
  border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.11),0 0 42px rgba(180,205,255,.15),0 30px 80px rgba(0,0,0,.5);
}
.node-title{
  position:relative;font-size:16px;font-weight:800;letter-spacing:-.25px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:18px;
}
.node-content{
  position:relative;margin-top:9px;color:#8f97a4;font-size:13px;line-height:1.48;
  white-space:pre-wrap;word-break:break-word;max-height:58px;overflow:hidden;
}
.node-delete{
  position:absolute;right:10px;top:10px;width:25px;height:25px;
  border:1px solid rgba(255,255,255,.12);border-radius:8px;
  background:rgba(0,0,0,.24);color:#7e8693;display:grid;place-items:center;
  cursor:pointer;opacity:0;transition:.18s;z-index:5;
}
.node:hover .node-delete{opacity:1}
.node-delete:hover{color:#fff;border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.08)}
.node-dot{
  position:absolute;right:-6px;top:50%;width:12px;height:12px;
  transform:translateY(-50%);border-radius:50%;
  background:#10141a;border:2px solid #77808d;
  box-shadow:0 0 0 5px rgba(6,7,10,.92),0 0 14px rgba(160,185,230,.18);
  cursor:crosshair;z-index:8;transition:.18s;
}
.node-dot:hover,.node.near .node-dot{
  background:#fff;border-color:#fff;transform:translateY(-50%) scale(1.25);
  box-shadow:0 0 0 5px rgba(6,7,10,.92),0 0 20px rgba(255,255,255,.5);
}
.node-highlight .card{animation:pulse .9s ease}
@keyframes pulse{
  50%{box-shadow:0 0 0 4px rgba(255,255,255,.15),0 0 45px rgba(180,205,255,.2)}
}
.empty{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  text-align:center;transition:.35s;
}
.empty-box{transform:translateY(-5%);animation:emptyIn .6s ease}
@keyframes emptyIn{from{opacity:0;transform:translateY(-5%) scale(.96)}to{opacity:1;transform:translateY(-5%) scale(1)}}
.empty-logo{
  width:58px;height:58px;border:1px solid var(--border-hi);border-radius:18px;
  margin:0 auto 16px;display:grid;place-items:center;font-weight:900;
  background:rgba(255,255,255,.035);box-shadow:0 0 45px rgba(150,180,255,.06)
}
.empty strong{display:block;font-size:22px;letter-spacing:-.6px}
.empty span{display:block;color:#6f7784;font-size:13px;line-height:1.6;margin-top:8px}
.controls{
  position:absolute;left:15px;bottom:15px;z-index:20;
  display:flex;align-items:center;gap:3px;padding:5px;
  border:1px solid var(--border);border-radius:14px;
  background:rgba(10,12,16,.76);backdrop-filter:blur(20px);
  box-shadow:0 15px 35px rgba(0,0,0,.28)
}
.controls button{
  width:37px;height:34px;border:0;background:transparent;border-radius:9px;
  color:#a3abb7;cursor:pointer;font-size:17px
}
.controls button:hover{background:rgba(255,255,255,.07);color:#fff}
.zoom{min-width:50px;text-align:center;color:#747c88;font-size:11px}
.hint{
  position:absolute;right:15px;bottom:15px;z-index:20;padding:9px 12px;
  border:1px solid var(--border);border-radius:11px;background:rgba(10,12,16,.65);
  backdrop-filter:blur(18px);color:#666e7b;font-size:11px
}
.connection-mode{
  position:absolute;top:15px;left:50%;transform:translateX(-50%);
  z-index:30;padding:9px 13px;border:1px solid rgba(255,255,255,.22);
  border-radius:999px;background:rgba(16,19,25,.9);backdrop-filter:blur(18px);
  color:#dfe4ec;font-size:11px;opacity:0;pointer-events:none;transition:.2s;
}
.connection-mode.show{opacity:1}
.overlay{
  position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;
  background:rgba(0,0,0,.68);backdrop-filter:blur(9px);
}
.overlay[hidden]{display:none}
.modal{
  width:min(480px,100%);padding:23px;border-radius:23px;
  background:linear-gradient(145deg,#151920,#0e1015);
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 35px 120px rgba(0,0,0,.72);
  animation:modalIn .25s cubic-bezier(.16,1,.3,1)
}
@keyframes modalIn{
  from{opacity:0;transform:translateY(18px) scale(.97)}
  to{opacity:1;transform:none}
}
.modal h2{margin:0 0 19px;font-size:21px;letter-spacing:-.5px}
.field{margin-bottom:14px}
.field label{display:block;color:#7c8491;font-size:11px;margin:0 0 7px}
.field input,.field textarea{
  width:100%;outline:0;border:1px solid var(--border);border-radius:12px;
  background:#080a0e;color:#fff;padding:12px 13px;transition:.2s
}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{
  border-color:rgba(255,255,255,.35);box-shadow:0 0 0 4px rgba(255,255,255,.035)
}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.delete-btn{margin-right:auto;color:#ff8d8d!important}
.toast{
  position:fixed;left:50%;bottom:26px;z-index:200;
  transform:translate(-50%,16px);opacity:0;
  padding:10px 15px;border-radius:999px;background:#f1f3f7;color:#080a0d;
  font-size:12px;font-weight:750;transition:.22s;pointer-events:none
}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:720px){
  .topbar{height:62px;padding:8px 9px}
  .brand-name,.brand-sub{display:none}
  .brand-mark{width:36px;height:36px}
  .search{flex:1;width:auto}
  .new span{display:none}
  .hint{display:none}
  .node{width:195px}
  .card{min-height:98px;padding:15px}
}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <div class="brand-name">NZX OSINT TOOL</div>
        <div class="brand-sub">NODE GRAPH WORKSPACE</div>
      </div>
    </div>

    <div class="actions">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
        </svg>
        <input id="search" placeholder="Search nodes...">
      </div>
      <button class="btn primary" id="addBtn">＋ <span>New node</span></button>
      <button class="btn icon" id="saveBtn" title="Export">↓</button>
      <button class="btn icon" id="loadBtn" title="Import">↑</button>
    </div>
  </header>

  <main class="workspace">
    <div class="canvas" id="canvas">
      <div class="world" id="world">
        <svg class="edges" id="edges" viewBox="-5000 -5000 10000 10000" preserveAspectRatio="none"></svg>
      </div>

      <div class="empty" id="empty">
        <div class="empty-box">
          <div class="empty-logo">N</div>
          <strong>NZX OSINT TOOL</strong>
          <span>Создай узел и строй визуальную сеть.<br>Перемещай узлы — ближайшие связи создаются автоматически.</span>
        </div>
      </div>

      <div class="connection-mode" id="connectionMode">Перетащи к другому узлу — связь создастся автоматически</div>
    </div>

    <div class="controls">
      <button id="minus">−</button>
      <div class="zoom" id="zoomText">100%</div>
      <button id="plus">＋</button>
      <button id="reset">⌂</button>
    </div>
    <div class="hint">Drag nodes · drag background · wheel to zoom · double-click to edit</div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">New node</h2>
    <div class="field">
      <label>Название узла</label>
      <input id="titleInput" maxlength="120" placeholder="Например: Username">
    </div>
    <div class="field">
      <label>Что внутри</label>
      <textarea id="contentInput" maxlength="4000" placeholder="Информация внутри узла..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn delete-btn" id="deleteBtn">Удалить</button>
      <button class="btn" id="cancelBtn">Отмена</button>
      <button class="btn primary" id="createBtn">Создать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input id="fileInput" type="file" accept=".json,application/json" hidden>

<script>
(() => {
  "use strict";

  const KEY="nzx-osint-graph";
  const canvas=document.getElementById("canvas");
  const world=document.getElementById("world");
  const edges=document.getElementById("edges");
  const empty=document.getElementById("empty");
  const overlay=document.getElementById("overlay");
  const titleInput=document.getElementById("titleInput");
  const contentInput=document.getElementById("contentInput");
  const createBtn=document.getElementById("createBtn");
  const deleteBtn=document.getElementById("deleteBtn");
  const modalTitle=document.getElementById("modalTitle");
  const search=document.getElementById("search");
  const toastEl=document.getElementById("toast");
  const connectionMode=document.getElementById("connectionMode");

  let state={nodes:{},links:[]};
  let editingId=null;
  let scale=1;
  let panX=innerWidth/2;
  let panY=Math.max(150,innerHeight/2);
  let nodeDrag=null;
  let panDrag=null;
  let linkDrag=null;
  let nearestId=null;
  let newEdgeKeys=new Set();
  let saveTimer;

  const uid=()=> "n_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);

  function toast(t){
    toastEl.textContent=t;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t=setTimeout(()=>toastEl.classList.remove("show"),1300);
  }

  function persist(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{
      localStorage.setItem(KEY,JSON.stringify(state));
    },150);
  }

  function safe(v){
    const d=document.createElement("div");
    d.textContent=v||"";
    return d.innerHTML;
  }

  function screenToWorld(x,y){
    const r=canvas.getBoundingClientRect();
    return {x:(x-r.left-panX)/scale,y:(y-r.top-panY)/scale};
  }

  function applyView(){
    world.style.transform=`translate(${panX}px,${panY}px) scale(${scale})`;
    document.getElementById("zoomText").textContent=Math.round(scale*100)+"%";
    renderEdges();
  }

  function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

  function nearestNode(x,y,ignore){
    let best=null,d=Infinity;
    Object.values(state.nodes).forEach(n=>{
      if(n.id===ignore)return;
      const dd=distance({x,y},n);
      if(dd<d){d=dd;best=n}
    });
    return best?{node:best,dist:d}:null;
  }

  function hasLink(a,b){
    return state.links.some(l=>(l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  }

  function addLink(a,b,animate=true){
    if(!a||!b||a===b||hasLink(a,b))return false;
    state.links.push({a,b});
    if(animate)newEdgeKeys.add([a,b].sort().join("|"));
    return true;
  }

  function removeNode(id){
    delete state.nodes[id];
    state.links=state.links.filter(l=>l.a!==id&&l.b!==id);
  }

  function openModal(id=null){
    editingId=id;
    modalTitle.textContent=id?"Edit node":"New node";
    createBtn.textContent=id?"Save":"Create";
    deleteBtn.style.display=id?"flex":"none";
    if(id){
      titleInput.value=state.nodes[id].title;
      contentInput.value=state.nodes[id].content;
    }else{
      titleInput.value="";
      contentInput.value="";
    }
    overlay.hidden=false;
    setTimeout(()=>titleInput.focus(),40);
  }

  function closeModal(){
    overlay.hidden=true;
    editingId=null;
  }

  function createOrSave(){
    const title=titleInput.value.trim();
    if(!title){titleInput.focus();return}

    if(editingId){
      state.nodes[editingId].title=title;
      state.nodes[editingId].content=contentInput.value.trim();
      toast("Узел обновлён");
    }else{
      const c=screenToWorld(innerWidth/2,innerHeight/2);
      const count=Object.keys(state.nodes).length;
      const angle=count*.8;
      const radius=Math.min(70+count*12,210);
      const x=c.x+Math.cos(angle)*radius;
      const y=c.y+Math.sin(angle)*radius;
      const id=uid();

      state.nodes[id]={id,title,content:contentInput.value.trim(),x,y};

      // Автоматическая связь с ближайшим существующим узлом.
      const near=nearestNode(x,y,id);
      if(near && near.dist<500)addLink(id,near.node.id,true);
      toast(near&&near.dist<500?"Узел создан · связь построена":"Узел создан");
    }

    closeModal();
    persist();
    render();
  }

  function render(){
    document.querySelectorAll(".node").forEach(n=>n.remove());

    const q=search.value.trim().toLowerCase();
    const nodes=Object.values(state.nodes);
    empty.style.display=nodes.length?"none":"grid";

    nodes.forEach(n=>{
      const el=document.createElement("div");
      el.className="node";
      el.dataset.id=n.id;
      el.style.left=n.x+"px";
      el.style.top=n.y+"px";

      const match=!q||(n.title+" "+n.content).toLowerCase().includes(q);
      if(q&&!match)el.style.opacity=".18";
      if(q&&match)el.classList.add("node-highlight");

      el.innerHTML=`
        <div class="card">
          <button class="node-delete" title="Удалить">×</button>
          <div class="node-title">${safe(n.title)}</div>
          <div class="node-content">${safe(n.content)||"Пустой узел"}</div>
        </div>
        <div class="node-dot" title="Создать связь"></div>
      `;

      world.appendChild(el);

      const card=el.querySelector(".card");
      const dot=el.querySelector(".node-dot");
      const del=el.querySelector(".node-delete");

      card.addEventListener("pointerdown",e=>startNodeDrag(e,n.id));
      card.addEventListener("dblclick",e=>{
        if(!e.target.closest(".node-delete"))openModal(n.id);
      });

      dot.addEventListener("pointerdown",e=>startLinkDrag(e,n.id));

      del.addEventListener("pointerdown",e=>e.stopPropagation());
      del.addEventListener("click",e=>{
        e.stopPropagation();
        if(confirm("Удалить этот узел и его связи?")){
          el.classList.add("removing");
          setTimeout(()=>{
            removeNode(n.id);
            persist();
            render();
          },190);
        }
      });
    });

    renderEdges();
  }

  function edgePath(a,b){
    const dx=b.x-a.x,dy=b.y-a.y;
    const len=Math.max(1,Math.hypot(dx,dy));
    const nx=dx/len,ny=dy/len;

    // Центр каждой карточки — точка привязки. Отступ не зависит от zoom.
    const x1=a.x+nx*108,y1=a.y+ny*52;
    const x2=b.x-nx*108,y2=b.y-ny*52;
    const bend=Math.max(50,Math.min(170,len*.28));

    return `M ${x1} ${y1} C ${x1+nx*bend} ${y1+ny*bend}, ${x2-nx*bend} ${y2-ny*bend}, ${x2} ${y2}`;
  }

  function renderEdges(){
    edges.innerHTML="";

    state.links.forEach(l=>{
      const a=state.nodes[l.a],b=state.nodes[l.b];
      if(!a||!b)return;
      const key=[l.a,l.b].sort().join("|");
      const d=edgePath(a,b);

      const bg=document.createElementNS("http://www.w3.org/2000/svg","path");
      bg.classList.add("edge-bg");
      bg.setAttribute("d",d);
      edges.appendChild(bg);

      const p=document.createElementNS("http://www.w3.org/2000/svg","path");
      p.classList.add("edge");
      if(newEdgeKeys.has(key))p.classList.add("new");
      p.setAttribute("d",d);
      edges.appendChild(p);
    });

    if(linkDrag){
      const a=state.nodes[linkDrag.id];
      if(a){
        const x1=a.x+108,y1=a.y;
        const x2=linkDrag.current.x,y2=linkDrag.current.y;
        const p=document.createElementNS("http://www.w3.org/2000/svg","path");
        p.classList.add("edge","active");
        p.setAttribute("stroke-dasharray","7 8");
        p.setAttribute("d",`M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`);
        edges.appendChild(p);
      }
    }

    if(newEdgeKeys.size){
      setTimeout(()=>{
        newEdgeKeys.clear();
        document.querySelectorAll(".edge.new").forEach(e=>e.classList.remove("new"));
      },600);
    }
  }

  function highlightNearest(id){
    document.querySelectorAll(".node.near").forEach(x=>x.classList.remove("near"));
    nearestId=null;
    const n=state.nodes[id];
    if(!n)return;
    const r=nearestNode(n.x,n.y,id);
    if(r&&r.dist<260){
      nearestId=r.node.id;
      const el=document.querySelector(`.node[data-id="${r.node.id}"]`);
      if(el)el.classList.add("near");
    }
  }

  function startNodeDrag(e,id){
    if(e.button!==undefined&&e.button!==0)return;
    e.preventDefault();
    e.stopPropagation();

    const n=state.nodes[id];
    const p=screenToWorld(e.clientX,e.clientY);
    nodeDrag={id,dx:n.x-p.x,dy:n.y-p.y};

    const el=document.querySelector(`.node[data-id="${id}"]`);
    if(el)el.classList.add("moving");

    connectionMode.classList.add("show");
  }

  function startLinkDrag(e,id){
    e.preventDefault();
    e.stopPropagation();
    linkDrag={id,current:screenToWorld(e.clientX,e.clientY)};
    connectionMode.classList.add("show");
    renderEdges();
  }

  window.addEventListener("pointermove",e=>{
    if(nodeDrag){
      const p=screenToWorld(e.clientX,e.clientY);
      const n=state.nodes[nodeDrag.id];
      n.x=p.x+nodeDrag.dx;
      n.y=p.y+nodeDrag.dy;

      const el=document.querySelector(`.node[data-id="${n.id}"]`);
      if(el){el.style.left=n.x+"px";el.style.top=n.y+"px"}

      highlightNearest(n.id);
      renderEdges();
    }

    if(linkDrag){
      linkDrag.current=screenToWorld(e.clientX,e.clientY);
      document.querySelectorAll(".node.near").forEach(x=>x.classList.remove("near"));
      nearestId=null;

      const r=nearestNode(linkDrag.current.x,linkDrag.current.y,linkDrag.id);
      if(r&&r.dist<150){
        nearestId=r.node.id;
        const el=document.querySelector(`.node[data-id="${nearestId}"]`);
        if(el)el.classList.add("near");
      }
      renderEdges();
    }

    if(panDrag){
      panX=panDrag.ox+e.clientX-panDrag.sx;
      panY=panDrag.oy+e.clientY-panDrag.sy;
      applyView();
    }
  });

  window.addEventListener("pointerup",()=>{
    if(nodeDrag){
      const n=state.nodes[nodeDrag.id];
      const r=nearestNode(n.x,n.y,nodeDrag.id);

      // Главное: если узел оказался рядом — линия создаётся сама.
      if(r&&r.dist<145&&!hasLink(n.id,r.node.id)){
        addLink(n.id,r.node.id,true);
        toast("Автоматическая связь создана");
      }

      const el=document.querySelector(`.node[data-id="${n.id}"]`);
      if(el)el.classList.remove("moving");

      persist();
      render();
      nodeDrag=null;
      nearestId=null;
    }

    if(linkDrag){
      if(nearestId&&!hasLink(linkDrag.id,nearestId)){
        addLink(linkDrag.id,nearestId,true);
        persist();
        toast("Связь создана");
      }
      linkDrag=null;
      nearestId=null;
      document.querySelectorAll(".node.near").forEach(x=>x.classList.remove("near"));
      connectionMode.classList.remove("show");
      renderEdges();
    }

    if(panDrag){
      panDrag=null;
      canvas.classList.remove("dragging");
    }
  });

  canvas.addEventListener("pointerdown",e=>{
    if(e.target.closest(".node"))return;
    if(e.button!==undefined&&e.button!==0)return;
    panDrag={sx:e.clientX,sy:e.clientY,ox:panX,oy:panY};
    canvas.classList.add("dragging");
  });

  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    const before=screenToWorld(e.clientX,e.clientY);
    const factor=e.deltaY<0?1.1:.9;
    scale=Math.max(.35,Math.min(2.5,scale*factor));
    const after=screenToWorld(e.clientX,e.clientY);
    panX+=(after.x-before.x)*scale;
    panY+=(after.y-before.y)*scale;
    applyView();
  },{passive:false});

  document.getElementById("plus").onclick=()=>{
    scale=Math.min(2.5,scale+.1);applyView();
  };
  document.getElementById("minus").onclick=()=>{
    scale=Math.max(.35,scale-.1);applyView();
  };
  document.getElementById("reset").onclick=()=>{
    scale=1;panX=innerWidth/2;panY=Math.max(150,innerHeight/2);applyView();
  };

  document.getElementById("addBtn").onclick=()=>openModal();
  document.getElementById("cancelBtn").onclick=closeModal;
  overlay.addEventListener("pointerdown",e=>{if(e.target===overlay)closeModal()});
  createBtn.onclick=createOrSave;
  deleteBtn.onclick=()=>{
    if(!editingId)return;
    if(confirm("Удалить этот узел и его связи?")){
      removeNode(editingId);closeModal();persist();render();
    }
  };

  search.addEventListener("input",render);

  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&!overlay.hidden)closeModal();
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){
      e.preventDefault();
      localStorage.setItem(KEY,JSON.stringify(state));
      toast("Сохранено");
    }
  });

  document.getElementById("saveBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="nzx-osint-graph.json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  document.getElementById("loadBtn").onclick=()=>document.getElementById("fileInput").click();
  document.getElementById("fileInput").addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const x=JSON.parse(reader.result);
        if(!x.nodes||!Array.isArray(x.links))throw new Error();
        state=x;persist();render();toast("Граф импортирован");
      }catch(err){alert("Файл повреждён или имеет неправильный формат.")}
    };
    reader.readAsText(file);
    e.target.value="";
  });

  try{
    const saved=localStorage.getItem(KEY);
    if(saved){
      const parsed=JSON.parse(saved);
      if(parsed&&parsed.nodes)state=parsed;
    }
  }catch(e){}

  render();
  applyView();

  addEventListener("resize",()=>{
    if(!Object.keys(state.nodes).length){
      panX=innerWidth/2;
      panY=Math.max(150,innerHeight/2);
    }
    applyView();
  });
})();
</script>
</body>
                            </html>
