<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Node Graph</title>
<style>
:root{
  --bg:#07080a;
  --panel:rgba(16,18,22,.86);
  --panel-solid:#101216;
  --card:#15181e;
  --card2:#1a1e25;
  --line:rgba(255,255,255,.24);
  --line-active:#fff;
  --text:#f5f7fa;
  --muted:#8b919c;
  --border:rgba(255,255,255,.11);
  --border2:rgba(255,255,255,.22);
  --shadow:0 18px 50px rgba(0,0,0,.42);
  --accent:#fff;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% -10%,rgba(255,255,255,.07),transparent 35%),
    radial-gradient(circle at 10% 90%,rgba(255,255,255,.025),transparent 30%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  touch-action:none;
}
button,input,textarea{font:inherit}
button{color:inherit}
.app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{
  height:72px;flex:none;display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border);
  background:rgba(7,8,10,.78);backdrop-filter:blur(22px);z-index:20;
}
.logo{
  display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:-.3px;
  white-space:nowrap;
}
.logo-mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:#fff;color:#08090b;font-weight:900;box-shadow:0 5px 22px rgba(255,255,255,.12)
}
.toolbar{display:flex;align-items:center;gap:8px;margin-left:auto}
.search{
  width:min(310px,34vw);height:40px;border:1px solid var(--border);
  border-radius:12px;background:rgba(255,255,255,.045);
  display:flex;align-items:center;padding:0 12px;gap:8px;
}
.search svg{opacity:.55;flex:none}
.search input{width:100%;border:0;outline:0;background:transparent;color:#fff}
.search input::placeholder{color:#666c76}
.btn{
  height:40px;padding:0 13px;border:1px solid var(--border);
  border-radius:12px;background:rgba(255,255,255,.045);cursor:pointer;
  transition:.18s ease;display:flex;align-items:center;gap:7px;
}
.btn:hover{background:rgba(255,255,255,.09);border-color:var(--border2)}
.btn.primary{background:#fff;color:#08090b;border-color:#fff;font-weight:700}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 7px 22px rgba(255,255,255,.12)}
.iconbtn{width:40px;padding:0;justify-content:center}
.status{
  position:fixed;right:16px;bottom:16px;z-index:50;
  padding:8px 12px;border:1px solid var(--border);border-radius:999px;
  background:rgba(15,17,21,.9);backdrop-filter:blur(15px);
  color:#8e949e;font-size:12px;opacity:0;transform:translateY(8px);
  transition:.25s;pointer-events:none;
}
.status.show{opacity:1;transform:translateY(0)}
.workspace{position:relative;flex:1;min-height:0;overflow:hidden}
.canvas{
  position:absolute;inset:0;overflow:hidden;cursor:grab;
  background-image:
    radial-gradient(circle,rgba(255,255,255,.095) 1px,transparent 1px);
  background-size:28px 28px;
}
.canvas.dragging{cursor:grabbing}
.world{position:absolute;left:0;top:0;width:1px;height:1px;transform-origin:0 0}
.edges{position:absolute;left:-5000px;top:-5000px;width:10000px;height:10000px;
  overflow:visible;pointer-events:none}
.edge{
  fill:none;stroke:var(--line);stroke-width:2.2;stroke-linecap:round;
  transition:stroke .15s,stroke-width .15s;
}
.edge.glow{stroke:rgba(255,255,255,.07);stroke-width:8}
.edge.active{stroke:#fff;stroke-width:3}
.node{
  position:absolute;width:220px;min-height:104px;
  transform:translate(-50%,-50%);
  user-select:none;touch-action:none;
}
.card{
  width:100%;min-height:104px;padding:16px 17px;
  border:1px solid var(--border2);border-radius:18px;
  background:linear-gradient(145deg,rgba(28,32,39,.97),rgba(16,18,22,.97));
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
  transition:.16s ease;cursor:grab;
}
.node:hover .card{
  border-color:rgba(255,255,255,.38);
  transform:translateY(-2px);
  box-shadow:0 22px 58px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04);
}
.node.selected .card{
  border-color:#fff;
  box-shadow:0 0 0 2px rgba(255,255,255,.12),0 24px 65px rgba(0,0,0,.52);
}
.node.moving .card{cursor:grabbing;transform:scale(1.025);z-index:100}
.node.near .card{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.12),0 0 35px rgba(255,255,255,.08)}
.node-title{font-size:16px;font-weight:750;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-content{
  margin-top:8px;font-size:13px;line-height:1.45;color:var(--muted);
  white-space:pre-wrap;word-break:break-word;max-height:55px;overflow:hidden;
}
.node-dot{
  position:absolute;width:10px;height:10px;border-radius:50%;
  right:-5px;top:50%;transform:translateY(-50%);
  background:#171a20;border:2px solid rgba(255,255,255,.55);
  box-shadow:0 0 0 4px var(--bg);cursor:crosshair;z-index:3;
}
.node-dot:hover{background:#fff;border-color:#fff;transform:translateY(-50%) scale(1.35)}
.node-delete{
  position:absolute;right:10px;top:-10px;width:25px;height:25px;
  border-radius:8px;border:1px solid var(--border2);background:#15181d;
  color:#aaa;display:grid;place-items:center;opacity:0;cursor:pointer;z-index:5;
}
.node:hover .node-delete{opacity:1}
.node-delete:hover{color:#fff;border-color:#fff}
.empty{
  position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;
  text-align:center;color:#747a84;
}
.empty div{max-width:430px}
.empty strong{display:block;color:#dfe2e7;font-size:20px;margin-bottom:8px}
.empty span{font-size:13px;line-height:1.6}
.controls{
  position:absolute;left:16px;bottom:16px;z-index:15;
  display:flex;gap:7px;padding:6px;border:1px solid var(--border);
  border-radius:14px;background:rgba(13,15,19,.82);backdrop-filter:blur(18px);
}
.controls button{
  width:38px;height:34px;border:0;border-radius:9px;background:transparent;
  color:#aab0ba;cursor:pointer;font-size:17px;
}
.controls button:hover{background:rgba(255,255,255,.08);color:#fff}
.zoom-label{min-width:50px;display:grid;place-items:center;color:#737984;font-size:11px}
.help{
  position:absolute;right:16px;bottom:16px;z-index:15;
  padding:9px 12px;border:1px solid var(--border);border-radius:12px;
  background:rgba(13,15,19,.75);backdrop-filter:blur(15px);
  color:#777e89;font-size:11px;
}
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.64);backdrop-filter:blur(7px);
  z-index:100;display:grid;place-items:center;padding:20px;
}
.overlay[hidden]{display:none}
.modal{
  width:min(460px,100%);border:1px solid var(--border2);border-radius:22px;
  background:#111318;box-shadow:0 30px 100px rgba(0,0,0,.7);
  padding:22px;animation:modalIn .2s ease;
}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal h2{margin:0 0 18px;font-size:20px;letter-spacing:-.4px}
.field{margin-bottom:14px}
.field label{display:block;color:#7e858f;font-size:12px;margin-bottom:7px}
.field input,.field textarea{
  width:100%;border:1px solid var(--border);outline:0;border-radius:12px;
  background:#090b0e;color:#fff;padding:12px 13px;
}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.field input:focus,.field textarea:focus{border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.modal-actions .delete{margin-right:auto;color:#ff7777}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,15px);
  opacity:0;z-index:200;background:#f4f4f5;color:#08090a;padding:10px 15px;
  border-radius:999px;font-size:12px;font-weight:650;transition:.22s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.connection-hint{
  position:absolute;pointer-events:none;z-index:40;padding:7px 10px;border-radius:999px;
  background:#fff;color:#090a0c;font-size:11px;font-weight:700;opacity:0;
}
@media(max-width:700px){
  .top{height:62px;padding:9px 10px}
  .logo span{display:none}
  .search{width:auto;flex:1}
  .btn.new span{display:none}
  .help{display:none}
  .node{width:190px}
  .card{min-height:92px;padding:14px}
  .node-title{font-size:15px}
  .node-content{font-size:12px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">
      <div class="logo-mark">N</div>
      <span>Node Graph</span>
    </div>
    <div class="toolbar">
      <div class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path>
        </svg>
        <input id="search" placeholder="Поиск узла...">
      </div>
      <button class="btn new primary" id="addBtn">＋ <span>Новый узел</span></button>
      <button class="btn iconbtn" id="saveBtn" title="Сохранить">↓</button>
      <button class="btn iconbtn" id="loadBtn" title="Импорт">↑</button>
    </div>
  </header>

  <main class="workspace">
    <div class="canvas" id="canvas">
      <div class="world" id="world">
        <svg class="edges" id="edges"></svg>
      </div>
      <div class="empty" id="empty">
        <div>
          <strong>Создай первый узел</strong>
          <span>Нажми «Новый узел». После создания узел можно свободно перетаскивать. Подведи его к другому узлу — ближайшая связь подсветится.</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="minus">−</button>
      <div class="zoom-label" id="zoomText">100%</div>
      <button id="plus">＋</button>
      <button id="reset">⌂</button>
    </div>
    <div class="help">Перетаскивай узлы мышью / пальцем · фон — перемещение · колесо — масштаб</div>
  </main>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal">
    <h2 id="modalTitle">Новый узел</h2>
    <div class="field">
      <label>Название узла</label>
      <input id="titleInput" maxlength="120" placeholder="Например: Roblox">
    </div>
    <div class="field">
      <label>Что внутри</label>
      <textarea id="contentInput" maxlength="4000" placeholder="Напиши содержимое узла..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn delete" id="deleteBtn">Удалить</button>
      <button class="btn" id="cancelBtn">Отмена</button>
      <button class="btn primary" id="createBtn">Создать</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input id="fileInput" type="file" accept=".json,application/json" hidden>

<script>
(() => {
  "use strict";

  const KEY = "node-graph-v3";
  const canvas = document.getElementById("canvas");
  const world = document.getElementById("world");
  const edges = document.getElementById("edges");
  const empty = document.getElementById("empty");
  const overlay = document.getElementById("overlay");
  const titleInput = document.getElementById("titleInput");
  const contentInput = document.getElementById("contentInput");
  const createBtn = document.getElementById("createBtn");
  const deleteBtn = document.getElementById("deleteBtn");
  const modalTitle = document.getElementById("modalTitle");
  const search = document.getElementById("search");
  const toastEl = document.getElementById("toast");

  let state = { nodes:{}, links:[] };
  let editingId = null;
  let scale = 1;
  let panX = window.innerWidth / 2;
  let panY = Math.max(150, window.innerHeight / 2);
  let nodeDrag = null;
  let panDrag = null;
  let linkDrag = null;
  let nearestId = null;
  let saveTimer = null;

  const uid = () => "n_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2,8);

  function toast(text){
    toastEl.textContent = text;
    toastEl.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove("show"), 1400);
  }

  function persist(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      localStorage.setItem(KEY, JSON.stringify(state));
      toast("Сохранено");
    }, 250);
  }

  function loadLocal(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && parsed.nodes) state = parsed;
      }
    }catch(e){}
  }

  function safe(s){
    const d = document.createElement("div");
    d.textContent = s || "";
    return d.innerHTML;
  }

  function screenToWorld(clientX, clientY){
    const r = canvas.getBoundingClientRect();
    return {
      x:(clientX-r.left-panX)/scale,
      y:(clientY-r.top-panY)/scale
    };
  }

  function worldToScreen(x,y){
    const r = canvas.getBoundingClientRect();
    return {
      x:r.left+panX+x*scale,
      y:r.top+panY+y*scale
    };
  }

  function applyView(){
    world.style.transform = `translate(${panX}px,${panY}px) scale(${scale})`;
    document.getElementById("zoomText").textContent = Math.round(scale*100) + "%";
    renderEdges();
  }

  function makeNode(title, content, x, y){
    const id = uid();
    state.nodes[id] = {
      id,title:title || "Без названия",content:content || "",x,y
    };
    return id;
  }

  function connected(a,b){
    return state.links.some(l => (l.a===a&&l.b===b)||(l.a===b&&l.b===a));
  }

  function addLink(a,b){
    if(!a || !b || a===b || connected(a,b)) return;
    state.links.push({a,b});
  }

  function removeNode(id){
    delete state.nodes[id];
    state.links = state.links.filter(l => l.a!==id && l.b!==id);
  }

  function nearestNode(x,y,ignoreId){
    let best=null, dist=Infinity;
    for(const n of Object.values(state.nodes)){
      if(n.id===ignoreId) continue;
      const d=Math.hypot(n.x-x,n.y-y);
      if(d<dist){dist=d;best=n}
    }
    return best ? {node:best,dist} : null;
  }

  function openModal(id=null){
    editingId=id;
    modalTitle.textContent=id ? "Редактировать узел" : "Новый узел";
    createBtn.textContent=id ? "Сохранить" : "Создать";
    deleteBtn.style.display=id ? "flex" : "none";
    if(id){
      const n=state.nodes[id];
      titleInput.value=n.title;
      contentInput.value=n.content;
    }else{
      titleInput.value="";
      contentInput.value="";
    }
    overlay.hidden=false;
    setTimeout(()=>titleInput.focus(),30);
  }

  function closeModal(){
    overlay.hidden=true;
    editingId=null;
  }

  function saveModal(){
    const title=titleInput.value.trim();
    if(!title){titleInput.focus();return}
    if(editingId){
      state.nodes[editingId].title=title;
      state.nodes[editingId].content=contentInput.value.trim();
      toast("Узел обновлён");
    }else{
      const center=screenToWorld(window.innerWidth/2,window.innerHeight/2+20);
      const offset=Object.keys(state.nodes).length*18;
      const id=makeNode(title,contentInput.value.trim(),center.x+offset,center.y+offset);
      // Новый узел автоматически соединяется с ближайшим существующим.
      const near=nearestNode(state.nodes[id].x,state.nodes[id].y,id);
      if(near && near.dist<360) addLink(id,near.node.id);
      toast("Узел создан");
    }
    closeModal();
    persist();
    render();
  }

  function render(){
    document.querySelectorAll(".node").forEach(n=>n.remove());
    const q=search.value.trim().toLowerCase();
    const nodes=Object.values(state.nodes);
    empty.style.display=nodes.length ? "none" : "grid";

    for(const n of nodes){
      const div=document.createElement("div");
      div.className="node";
      div.dataset.id=n.id;
      div.style.left=n.x+"px";
      div.style.top=n.y+"px";

      const matched=!q || (n.title+" "+n.content).toLowerCase().includes(q);
      if(q && matched) div.classList.add("selected");

      div.innerHTML=`
        <div class="card">
          <button class="node-delete" title="Удалить">×</button>
          <div class="node-title">${safe(n.title)}</div>
          <div class="node-content">${safe(n.content) || "Пустой узел"}</div>
        </div>
        <div class="node-dot" title="Потянуть для создания связи"></div>
      `;

      world.appendChild(div);

      const card=div.querySelector(".card");
      const del=div.querySelector(".node-delete");
      const dot=div.querySelector(".node-dot");

      del.addEventListener("pointerdown",e=>e.stopPropagation());
      del.addEventListener("click",e=>{
        e.stopPropagation();
        if(confirm("Удалить этот узел?")){
          removeNode(n.id); persist(); render();
        }
      });

      card.addEventListener("dblclick",e=>{
        if(e.target.closest(".node-delete")) return;
        openModal(n.id);
      });

      card.addEventListener("pointerdown",e=>startNodeDrag(e,n.id));
      dot.addEventListener("pointerdown",e=>startLinkDrag(e,n.id));
    }
    renderEdges();
  }

  function renderEdges(){
    edges.innerHTML="";
    const ns=state.nodes;

    for(const l of state.links){
      const a=ns[l.a],b=ns[l.b];
      if(!a||!b) continue;

      const dx=b.x-a.x;
      const dy=b.y-a.y;
      const len=Math.max(1,Math.hypot(dx,dy));
      const nx=dx/len, ny=dy/len;
      const x1=a.x+nx*110, y1=a.y+ny*52;
      const x2=b.x-nx*110, y2=b.y-ny*52;
      const bend=Math.max(70,Math.min(180,len*.35));
      const cx1=x1+nx*bend,cy1=y1+ny*bend;
      const cx2=x2-nx*bend,cy2=y2-ny*bend;

      const glow=document.createElementNS("http://www.w3.org/2000/svg","path");
      glow.classList.add("edge","glow");
      glow.setAttribute("d",`M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`);
      edges.appendChild(glow);

      const line=document.createElementNS("http://www.w3.org/2000/svg","path");
      line.classList.add("edge");
      line.setAttribute("d",`M ${x1} ${y1} C ${cx1} ${cy1}, ${cx2} ${cy2}, ${x2} ${y2}`);
      edges.appendChild(line);
    }

    if(linkDrag){
      const a=ns[linkDrag.id];
      if(a){
        const x1=a.x+110,y1=a.y;
        const x2=linkDrag.current.x,y2=linkDrag.current.y;
        const line=document.createElementNS("http://www.w3.org/2000/svg","path");
        line.classList.add("edge","active");
        line.setAttribute("stroke-dasharray","7 7");
        line.setAttribute("d",`M ${x1} ${y1} C ${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}`);
        edges.appendChild(line);
      }
    }
  }

  function updateNearest(id){
    const n=state.nodes[id];
    const result=nearestNode(n.x,n.y,id);
    nearestId=null;
    document.querySelectorAll(".node.near").forEach(x=>x.classList.remove("near"));

    if(result && result.dist<260){
      nearestId=result.node.id;
      const el=document.querySelector(`.node[data-id="${result.node.id}"]`);
      if(el) el.classList.add("near");
    }
  }

  function startNodeDrag(e,id){
    if(e.button!==undefined && e.button!==0) return;
    e.preventDefault();
    e.stopPropagation();
    const n=state.nodes[id];
    const p=screenToWorld(e.clientX,e.clientY);
    nodeDrag={
      id,
      ox:n.x,
      oy:n.y,
      dx:n.x-p.x,
      dy:n.y-p.y
    };
    const el=document.querySelector(`.node[data-id="${id}"]`);
    if(el) el.classList.add("moving");
    e.currentTarget.setPointerCapture?.(e.pointerId);
  }

  function startLinkDrag(e,id){
    e.preventDefault();
    e.stopPropagation();
    const p=screenToWorld(e.clientX,e.clientY);
    linkDrag={id,current:p};
    renderEdges();
  }

  window.addEventListener("pointermove",e=>{
    if(nodeDrag){
      const p=screenToWorld(e.clientX,e.clientY);
      const n=state.nodes[nodeDrag.id];
      n.x=p.x+nodeDrag.dx;
      n.y=p.y+nodeDrag.dy;
      const el=document.querySelector(`.node[data-id="${n.id}"]`);
      if(el){el.style.left=n.x+"px";el.style.top=n.y+"px"}
      updateNearest(n.id);
      renderEdges();
    }
    if(linkDrag){
      linkDrag.current=screenToWorld(e.clientX,e.clientY);
      const result=nearestNode(linkDrag.current.x,linkDrag.current.y,linkDrag.id);
      nearestId=result && result.dist<150 ? result.node.id : null;
      document.querySelectorAll(".node.near").forEach(x=>x.classList.remove("near"));
      if(nearestId){
        const el=document.querySelector(`.node[data-id="${nearestId}"]`);
        if(el) el.classList.add("near");
      }
      renderEdges();
    }
    if(panDrag){
      panX=panDrag.ox+(e.clientX-panDrag.sx);
      panY=panDrag.oy+(e.clientY-panDrag.sy);
      applyView();
    }
  });

  window.addEventListener("pointerup",e=>{
    if(nodeDrag){
      const el=document.querySelector(`.node[data-id="${nodeDrag.id}"]`);
      if(el) el.classList.remove("moving");
      const n=state.nodes[nodeDrag.id];
      const result=nearestNode(n.x,n.y,nodeDrag.id);
      if(result && result.dist<135){
        addLink(nodeDrag.id,result.node.id);
        toast("Связь создана");
      }
      persist();
      render();
      nodeDrag=null;
      nearestId=null;
    }

    if(linkDrag){
      if(nearestId){
        addLink(linkDrag.id,nearestId);
        toast("Связь создана");
        persist();
      }
      linkDrag=null;
      nearestId=null;
      document.querySelectorAll(".node.near").forEach(x=>x.classList.remove("near"));
      renderEdges();
    }

    if(panDrag){
      panDrag=null;
      canvas.classList.remove("dragging");
    }
  });

  canvas.addEventListener("pointerdown",e=>{
    if(e.target.closest(".node")) return;
    if(e.button!==undefined && e.button!==0) return;
    panDrag={sx:e.clientX,sy:e.clientY,ox:panX,oy:panY};
    canvas.classList.add("dragging");
  });

  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    const before=screenToWorld(e.clientX,e.clientY);
    const factor=e.deltaY<0 ? 1.1 : .9;
    const next=Math.min(2.4,Math.max(.35,scale*factor));
    scale=next;
    const after=screenToWorld(e.clientX,e.clientY);
    panX+=(after.x-before.x)*scale;
    panY+=(after.y-before.y)*scale;
    applyView();
  },{passive:false});

  document.getElementById("plus").onclick=()=>{scale=Math.min(2.4,scale+.1);applyView()};
  document.getElementById("minus").onclick=()=>{scale=Math.max(.35,scale-.1);applyView()};
  document.getElementById("reset").onclick=()=>{
    scale=1;panX=window.innerWidth/2;panY=Math.max(150,window.innerHeight/2);applyView();
  };

  document.getElementById("addBtn").onclick=()=>openModal();
  document.getElementById("cancelBtn").onclick=closeModal;
  overlay.addEventListener("pointerdown",e=>{if(e.target===overlay)closeModal()});
  createBtn.onclick=saveModal;
  deleteBtn.onclick=()=>{
    if(!editingId)return;
    if(confirm("Удалить этот узел?")){
      removeNode(editingId);closeModal();persist();render();
    }
  };
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"&&!overlay.hidden)closeModal();
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){
      e.preventDefault();
      localStorage.setItem(KEY,JSON.stringify(state));toast("Сохранено");
    }
  });
  search.addEventListener("input",render);

  document.getElementById("saveBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download="node-graph.json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  };

  document.getElementById("loadBtn").onclick=()=>document.getElementById("fileInput").click();
  document.getElementById("fileInput").addEventListener("change",e=>{
    const file=e.target.files[0];
    if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const x=JSON.parse(r.result);
        if(!x.nodes)throw new Error();
        state=x;
        persist();render();toast("Импортировано");
      }catch(err){alert("Неверный JSON-файл")}
    };
    r.readAsText(file);
    e.target.value="";
  });

  loadLocal();

  // Если граф пустой — ничего не создаём автоматически.
  // Первый узел появляется только после нажатия "Новый узел".
  render();
  applyView();

  window.addEventListener("resize",()=>{
    if(!Object.keys(state.nodes).length){
      panX=window.innerWidth/2;
      panY=Math.max(150,window.innerHeight/2);
    }
    applyView();
  });
})();
</script>
</body>
  </html>
